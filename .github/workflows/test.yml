name: Test Workflow

on:
  push:
    branches:
      - test
  pull_request:
    types: [closed]
    branches:
      - test

jobs:
  test-ci:
    if: (github.ref == 'refs/heads/test') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          
      - name: "Run Unit Tests"
        run: mvn test
        
      - name: "Create PR from test to production"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "PR from test to production"
          title: "Merge test into production"
          body: |
            This PR was automatically created by the CI/CD workflow.
            
            Tests have passed successfully and code is ready for production.
            
            Once merged, the production workflow will automatically run.
          branch: "auto-pr-test-to-production"
          base: "production"
          delete-branch: true