name: Test Workflow

on:
  push:
    branches:
      - test
  pull_request:
    types: [closed]
    branches:
      - test

jobs:
  test-ci:
    if: (github.ref == 'refs/heads/test') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          
      - name: "Extract version from pom.xml"
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: "Update to release version"
        id: release_version
        run: |
          # Extract components
          CURRENT_VERSION=${{ steps.version.outputs.version }}
          
          # Handle versions in format MAJOR.MINOR-RC
          if [[ $CURRENT_VERSION =~ ([0-9]+)\.([0-9]+)(-RC)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            
            # Change to release version (remove RC suffix)
            NEW_VERSION="$MAJOR.$MINOR"
            
            echo "Release version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            # Update pom.xml with new version
            mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
          # Handle versions in format MAJOR.MINOR.PATCH-RC
          elif [[ $CURRENT_VERSION =~ ([0-9]+)\.([0-9]+)\.([0-9]+)(-RC)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            
            # Change to release version (remove RC suffix)
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            
            echo "Release version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            # Update pom.xml with new version
            mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
          # Already release version, no change needed
          elif [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)$ ]] || [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version already in release format: $CURRENT_VERSION"
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Failed to parse version: $CURRENT_VERSION"
            exit 1
          fi
          
      - name: "Run Unit Tests"
        run: mvn test
        
      - name: "Commit version changes"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add pom.xml
          git commit -m "Finalize version to ${{ steps.release_version.outputs.new_version }}" || echo "No changes to commit"
          git push origin test
          
      - name: "Create PR from test to production"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "PR from test to production"
          title: "Merge test into production"
          body: |
            This PR was automatically created by the CI/CD workflow.
            
            Tests have passed successfully and code is ready for production.
            Release version: ${{ steps.release_version.outputs.new_version }}
            
            Once merged, the production workflow will automatically run.
          branch: "auto-pr-test-to-production"
          base: "production"
          delete-branch: true