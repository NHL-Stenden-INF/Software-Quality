name: Production Workflow

on:
  push:
    branches:
      - production
  pull_request:
    types: [closed]
    branches:
      - production

jobs:
  production-deploy:
    if: (github.ref == 'refs/heads/production') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          
      - name: "Extract version from pom.xml"
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: "Build production package"
        run: mvn clean package
        
      - name: "Publish to GitHub Packages"
        run: |
          # Try to deploy and capture output
          OUTPUT=$(mvn deploy -DskipTests 2>&1) || {
            # Check if the error was due to 409 Conflict
            if echo "$OUTPUT" | grep -q "status code: 409"; then
              echo "Artifact already exists in GitHub Packages. Continuing workflow..."
              exit 0
            else
              # If it was a different error, show output and fail
              echo "$OUTPUT"
              exit 1
            fi
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar
          generate_release_notes: true
          tag_name: v${{ steps.version.outputs.version }}
          
      - name: "Create version tag"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          # Check if tag exists in remote
          if ! git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}"; then
            git tag -a v${{ steps.version.outputs.version }} -m "Release version ${{ steps.version.outputs.version }}"
            git push origin v${{ steps.version.outputs.version }}
          else
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping tag creation."
          fi