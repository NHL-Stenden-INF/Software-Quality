name: JavaFX CI/CD

on:
  push:
    branches:
      - development
      - acceptance
      - test

jobs:
  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build with Maven"
        run: mvn clean verify

  merge-development-to-acceptance:
    if: github.ref == 'refs/heads/development'
    needs: build-development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Merge development into acceptance"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git checkout acceptance
          git merge --no-ff origin/development -m "Automatic merge from development to acceptance"
          git push origin acceptance

  acceptance-ci:
    if: github.ref == 'refs/heads/acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Checkstyle"
        run: mvn checkstyle:check

  merge-acceptance-to-test:
    if: github.ref == 'refs/heads/acceptance'
    needs: acceptance-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Merge acceptance into test"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git checkout test
          git merge --no-ff origin/acceptance -m "Automatic merge from acceptance to test"
          git push origin test

  test-ci:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Unit Tests"
        run: mvn test

  merge-test-to-production:
    if: github.ref == 'refs/heads/test'
    needs: test-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Merge test into production"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git checkout production
          git merge --no-ff origin/test -m "Automatic merge from test to production"
          git push origin production