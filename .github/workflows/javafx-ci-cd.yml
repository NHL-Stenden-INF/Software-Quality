name: JavaFX CI/CD

on:
  push:
    branches: [ main, development, test, acceptance, production ]
  pull_request:
    branches: [ main, development, test, acceptance, production ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean verify

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jabberpoint-app
        path: target/*.jar