name: JavaFX CI/CD

on:
  push:
    branches:
      - development
      - acceptance
      - test
      - production

jobs:
  # DEVELOPMENT BRANCH WORKFLOW
  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build with Maven"
        run: mvn clean verify
      - name: "Merge development into acceptance"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # Fetch all branches
          git fetch origin
          
          # Check if acceptance branch exists, if not create it
          if ! git ls-remote --heads origin acceptance | grep acceptance; then
            git checkout -b acceptance
            git push origin acceptance
          else
            git checkout -b acceptance origin/acceptance
          fi
          
          # Try to merge with allowing unrelated histories
          git merge --allow-unrelated-histories --no-ff origin/development -m "Automatic merge from development to acceptance"
          git push origin acceptance

  # ACCEPTANCE BRANCH WORKFLOW
  acceptance-ci:
    if: github.ref == 'refs/heads/acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Checkstyle"
        run: mvn checkstyle:check
      - name: "Merge acceptance into test"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # Fetch all branches
          git fetch origin
          
          # Check if test branch exists, if not create it
          if ! git ls-remote --heads origin test | grep test; then
            git checkout -b test
            git push origin test
          else
            git checkout -b test origin/test
          fi
          
          # Try to merge with allowing unrelated histories
          git merge --allow-unrelated-histories --no-ff origin/acceptance -m "Automatic merge from acceptance to test"
          git push origin test

  # TEST BRANCH WORKFLOW
  test-ci:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Unit Tests"
        run: mvn test
      - name: "Merge test into production"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # Fetch all branches
          git fetch origin
          
          # Check if production branch exists, if not create it
          if ! git ls-remote --heads origin production | grep production; then
            git checkout -b production
            git push origin production
          else
            git checkout -b production origin/production
          fi
          
          # Try to merge with allowing unrelated histories
          git merge --allow-unrelated-histories --no-ff origin/test -m "Automatic merge from test to production"
          git push origin production

  # PRODUCTION BRANCH WORKFLOW
  production-deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build production package"
        run: mvn clean package