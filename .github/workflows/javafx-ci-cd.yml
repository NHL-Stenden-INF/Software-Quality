name: JavaFX CI/CD

on:
  push:
    branches:
      - development
      - acceptance
      - test
      - production

jobs:
  # DEVELOPMENT BRANCH WORKFLOW
  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build with Maven"
        run: mvn clean verify
      - name: "Setup Git for Merge"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
      - name: "Merge development into acceptance"
        run: |
          git fetch origin acceptance:acceptance
          git checkout acceptance
          git merge --no-ff origin/development -m "Automatic merge from development to acceptance"
          git push origin acceptance

  # ACCEPTANCE BRANCH WORKFLOW
  acceptance-ci:
    if: github.ref == 'refs/heads/acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Checkstyle"
        run: mvn checkstyle:check
      - name: "Setup Git for Merge"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
      - name: "Merge acceptance into test"
        run: |
          git fetch origin test:test
          git checkout test
          git merge --no-ff origin/acceptance -m "Automatic merge from acceptance to test"
          git push origin test

  # TEST BRANCH WORKFLOW
  test-ci:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Unit Tests"
        run: mvn test
      - name: "Setup Git for Merge"
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
      - name: "Merge test into production"
        run: |
          git fetch origin production:production
          git checkout production
          git merge --no-ff origin/test -m "Automatic merge from test to production"
          git push origin production

  # PRODUCTION BRANCH WORKFLOW
  production-deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build production package"
        run: mvn clean package