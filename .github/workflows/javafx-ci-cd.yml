name: JavaFX CI/CD

on:
  push:
    branches: [development, acceptance, test]
  pull_request:
    branches: [development, acceptance, test]

jobs:
  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build with Maven"
        run: mvn clean verify

  create-pr-acceptance:
    needs: build-development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create pull request: development → acceptance"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: acceptance
          branch: "pr-acceptance-${{ github.run_number }}"
          title: "Merge development into acceptance"
          body: "Automated pull request from development to acceptance."

  acceptance-ci:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Checkstyle"
        run: mvn checkstyle:check

  create-pr-test:
    needs: acceptance-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create pull request: acceptance → test"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: test
          branch: "pr-test-${{ github.run_number }}"
          title: "Merge acceptance into test"
          body: "Automated pull request from acceptance to test."

  test-ci:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Unit Tests"
        run: mvn test

  create-pr-production:
    needs: test-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create pull request: test → production"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: production
          branch: "pr-production-${{ github.run_number }}"
          title: "Merge test into production"
          body: "Automated pull request from test to production."
