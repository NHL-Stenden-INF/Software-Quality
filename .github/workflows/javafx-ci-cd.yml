name: JavaFX CI/CD

on:
  push:
    branches:
      - development
      - acceptance
      - test

jobs:
  build-development:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Build with Maven"
        run: mvn clean verify

  pr-development-to-acceptance:
    if: github.ref == 'refs/heads/development'
    needs: build-development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create PR: development -> acceptance"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: acceptance
          branch: "pr-acceptance-${{ github.run_number }}"
          title: "Merge development into acceptance"
          body: "Automated pull request from development to acceptance."

  acceptance-ci:
    if: github.ref == 'refs/heads/acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Checkstyle"
        run: mvn checkstyle:check

  pr-acceptance-to-test:
    if: github.ref == 'refs/heads/acceptance'
    needs: acceptance-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create PR: acceptance -> test"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: test
          branch: "pr-test-${{ github.run_number }}"
          title: "Merge acceptance into test"
          body: "Automated pull request from acceptance to test."

  test-ci:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: "Run Unit Tests"
        run: mvn test

  pr-test-to-production:
    if: github.ref == 'refs/heads/test'
    needs: test-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Create PR: test -> production"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: production
          branch: "pr-production-${{ github.run_number }}"
          title: "Merge test into production"
          body: "Automated pull request from test to production."
