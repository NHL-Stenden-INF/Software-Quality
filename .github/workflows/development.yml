name: Development Workflow

on:
  push:
    branches:
      - development

jobs:
  build-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: "Set up JDK 11"
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          
      # Remove version bumping from development workflow
      # We only want to build and verify at this stage
      
      - name: "Build with Maven"
        run: mvn clean verify
        
      - name: "Create PR from development to acceptance"
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "PR from development to acceptance"
          title: "Merge development into acceptance"
          body: |
            This PR was automatically created by the CI/CD workflow.
            
            Development build has passed verification and is ready for review.
            
            Once merged, the acceptance workflow will automatically run.
          branch: "auto-pr-dev-to-acceptance"
          base: "acceptance"
          delete-branch: true